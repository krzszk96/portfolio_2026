<div class="exp-page__header">
  <h1>Work Experience</h1>
  <p>Detailed overview of my professional journey and key contributions. I work with the latest technologies, to build modern, scalable web applications.</p>
</div>

@if (loading()) {
  <app-spinner label="Loading experience…" />
} @else {
  @for (job of experience(); track job.id) {
    <app-experience-card [item]="job" />
  }
}
