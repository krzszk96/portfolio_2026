<div class="proj-page__header">
  <h1>Projects</h1>
  <p>Work projects and personal side-projects I've built and contributed to.</p>
</div>

@if (loading()) {
  <app-spinner label="Loading projects…" />
} @else {
  <div class="proj-page__section-divider">
    <h2 class="proj-page__section-title">Work Projects</h2>
    <span class="proj-page__section-badge">Professional</span>
  </div>

  @for (project of workProjects(); track project.id) {
    <app-project-card [project]="project" />
  }

  <div class="proj-page__section-divider">
    <h2 class="proj-page__section-title">Personal Projects</h2>
    <span class="proj-page__section-badge">Side-projects</span>
  </div>

  @for (project of personalProjects(); track project.id) {
    <app-project-card [project]="project" [personal]="true" />
  }
}
