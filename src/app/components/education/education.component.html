<section class="education">
  <div class="education__header">
    <h2 class="education__title">Education & Languages</h2>
    <app-status-badge label="Achievements" variant="default" />
  </div>
  <div class="education__grid">
    @for (item of items(); track item.title) {
      <div class="education__card">
        <div class="education__icon">
          <img src="/assets/icons/verified.svg" alt="Verified" />
        </div>
        <div class="education__info">
          <h4>{{ item.title }}</h4>
          <p>{{ item.subtitle }}</p>
          <span class="education__date">{{ item.detail }}</span>
        </div>
      </div>
    }
  </div>
</section>
