<section class="certificates">
  <div class="certificates__header">
    <h2 class="certificates__title">Certificates</h2>
    <app-status-badge [label]="certificates().length.toString()" variant="default" />
  </div>
  <div class="certificates__grid">
    @for (cert of certificates(); track cert.title) {
      <div class="certificates__card">
        <div class="certificates__icon">
          <img src="/assets/icons/shield.svg" alt="Certificate" />
        </div>
        <div class="certificates__info">
          <h4>{{ cert.title }}</h4>
          <p>{{ cert.issuer }}</p>
          <span class="certificates__date">{{ cert.date }}</span>
        </div>
        <app-status-badge [label]="cert.status.label" [variant]="cert.status.variant" />
      </div>
    }
  </div>
</section>
