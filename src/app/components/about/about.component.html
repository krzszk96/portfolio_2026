<section class="about">
  <div class="about__header">
    <h2 class="about__title">About</h2>
  </div>
  @if (about(); as about) {
    <div class="about__content">
      <p>{{ about.intro }}</p>
      <ul class="about__highlights">
        @for (highlight of about.highlights; track highlight) {
          <li>{{ highlight }}</li>
        }
      </ul>
    </div>
  }
</section>
