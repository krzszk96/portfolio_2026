<section class="experience">
  <div class="experience__header">
    <h2 class="experience__title">Work Experience</h2>
    <a routerLink="/experience" class="experience__link">View details →</a>
  </div>

  @if (loading()) {
    <app-spinner label="Loading experience…" />
  } @else {
    <div class="experience__grid">
      @for (job of experience(); track job.id) {
        <a class="experience__card" routerLink="/experience" [fragment]="job.id">
          <div class="experience__card-header">
            <img src="/assets/icons/briefcase.svg" alt="" class="experience__card-icon" />
            <h3 class="experience__card-title">{{ job.role }}</h3>
            <app-status-badge [label]="job.employmentType" variant="default" />
          </div>
          <p class="experience__card-description">{{ job.cardDescription }}</p>
          <div class="experience__card-meta">
            <span class="experience__lang">
              <span class="experience__lang-dot" [style.background-color]="job.dateDotColor"></span>
              {{ job.dateRange }}
            </span>
          </div>
        </a>
      }
    </div>
  }
</section>
